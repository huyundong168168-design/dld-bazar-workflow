
<!DOCTYPE html>
<html lang="zh-CN">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DLD BAZAR API 测试</title>
<h2>DLD BAZAR 接口测试</h2>
<p>只读测试，不修改商品数据</p>
<input id="sku" value="2631567">
<button onclick="test()">测试接口</button>
<pre id="result">等待测试</pre>
<script>

async function test() {
  const sku = document.getElementById('sku').value.trim();
  const out = document.getElementById('result');
  out.textContent = '正在查询真实商城...';

  try {
    const response = await fetch(
      'https://www.dldbazar.com/api/products',
      { method: 'GET', credentials: 'omit' }
    );

    const data = await response.json();
    const items = Array.isArray(data) ? data : data.items;

    if (!response.ok) {
      throw new Error('HTTP ' + response.status);
    }
    if (!Array.isArray(items)) {
      throw new Error('未找到商品列表');
    }

    const product = items.find(p =>
      String(p.sku) === sku ||
      String(p.barcode || '') === sku
    );

    out.textContent = product
      ? 'HTTP: ' + response.status +
        '\nSKU: ' + product.sku +
        '\n名称: ' + product.name +
        '\n售价: €' + product.price +
        '\n库存: ' + product.stock +
        '\n条码: ' + (product.barcode || '无') +
        '\n上架状态: ' + product.is_active
      : 'HTTP: ' + response.status +
        '\n已读取商品数: ' + items.length +
        '\n未找到 SKU: ' + sku;
  } catch (e) {
    out.textContent = '连接失败: ' + e.message +
      '\n请检查接口权限或 CORS 跨域限制';
  }
}

</script>
</html>
