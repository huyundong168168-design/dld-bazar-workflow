
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DLD BAZAR 自动上架工作台</title>
<style>
body{margin:0;background:#f2f5fa;font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#152238}
header{background:#123b85;color:white;padding:30px 20px}
h1{font-size:24px;margin:0 0 8px}
main{padding:18px}
.card{background:white;border-radius:16px;padding:20px;margin-bottom:15px;box-shadow:0 2px 10px #0001}
button{background:#1769e0;color:white;border:0;border-radius:10px;padding:14px;width:100%;font-size:16px}
input{box-sizing:border-box;width:100%;padding:13px;border:1px solid #ccc;border-radius:10px;font-size:16px;margin:10px 0}
small{color:#667085}
</style>
</head>
<body>
<header>
<h1>🛒 DLD BAZAR</h1>
<div>自动上架工作台 · 测试版</div>
</header>
<main>
<div class="card">
<h3>商品查询</h3>
<input id="sku" placeholder="输入 SKU 或条码">
<button onclick="search()">查询商品</button>
<p id="result"></p>
</div>
<div class="card">
<h3>📦 库存匹配</h3>
<small>等待连接受保护的库存数据库</small>
</div>
<div class="card">
<h3>📷 图片审核</h3>
<small>等待接入商品图片处理流程</small>
</div>
<div class="card">
<h3>🚀 自动上架</h3>
<button onclick="alert('安全测试模式：尚未连接发布接口')">模拟测试</button>
</div>
<div class="card">
<h3>🔒 系统状态</h3>
<p>演示模式 · 不连接真实商城</p>
<small>不会修改商品、价格或库存</small>
</div>
</main>
<script>

async function search() {
  const sku = document.getElementById('sku').value.trim();
  const out = document.getElementById('result');

  if (!sku) {
    out.textContent = '请输入 SKU 或条码';
    return;
  }

  out.textContent = '正在查询 DLD BAZAR 商城...';

  try {
    const response = await fetch(
      'https://www.dldbazar.com/api/products',
      { method: 'GET', credentials: 'omit' }
    );

    if (!response.ok) {
      throw new Error('HTTP ' + response.status);
    }

    const data = await response.json();
    const items = Array.isArray(data) ? data : data.items;

    if (!Array.isArray(items)) {
      throw new Error('商品数据格式不正确');
    }

    const product = items.find(p =>
      String(p.sku) === sku ||
      String(p.barcode || '') === sku
    );

    out.textContent = product
      ? '商品名称：' + product.name +
        '\nSKU：' + product.sku +
        '\n条码：' + (product.barcode || '无') +
        '\n售价：€' + product.price +
        '\n库存：' + product.stock +
        '\n状态：' + (product.is_active ? '上架中' : '未上架')
      : '商城中未找到 SKU 或条码：' + sku;

    out.style.whiteSpace = 'pre-line';

  } catch (error) {
    out.textContent = '查询失败：' + error.message;
  }
}

</script>
</body>
</html>
